worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # ── MIME & Basics ───────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    # ── Rate Limiting Zones ─────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=login_limit:10m   rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:20m     rate=100r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:20m rate=30r/s;
    limit_req_status 429;

    # ── Upstreams ───────────────────────────────────────────────────────────
    upstream medisphere_backend {
        server backend:8000;
        keepalive 32;
    }

    upstream medisphere_frontend {
        server frontend:3000;
        keepalive 16;
    }

    # ── WebSocket upgrade map ───────────────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Logging ─────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── HTTP → HTTPS Redirect ───────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Main HTTPS Server ───────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name medisphere-ai.example.com localhost;

        # TLS configuration
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache   shared:MedSSL:10m;
        ssl_session_tickets off;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options            "DENY"                                         always;
        add_header X-Content-Type-Options     "nosniff"                                      always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin"              always;
        add_header X-XSS-Protection           "1; mode=block"                                always;
        add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()"     always;

        client_max_body_size 10M;

        # ── Auth login: strict rate limit ────────────────────────────────────
        location /api/v1/auth/login {
            limit_req zone=login_limit burst=3 nodelay;
            proxy_pass         http://medisphere_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── WebSocket ────────────────────────────────────────────────────────
        location /api/v1/ws/ {
            proxy_pass          http://medisphere_backend;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "upgrade";
            proxy_set_header    Host       $host;
            proxy_read_timeout  3600s;
        }

        # ── Internal metrics: restrict to private networks ────────────────────
        location /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 127.0.0.1;
            deny  all;
            proxy_pass http://medisphere_backend;
        }

        # ── API (FastAPI backend) ────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass         http://medisphere_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s;
        }

        # ── API docs (non-production only) ───────────────────────────────────
        location /docs {
            proxy_pass http://medisphere_backend/docs;
        }
        location /redoc {
            proxy_pass http://medisphere_backend/redoc;
        }
        location /health {
            proxy_pass http://medisphere_backend/health;
        }

        # ── Next.js Frontend ─────────────────────────────────────────────────
        location / {
            limit_req zone=general_limit burst=50 nodelay;
            proxy_pass         http://medisphere_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # ── Static assets — aggressive caching ──────────────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            proxy_pass http://medisphere_frontend;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}

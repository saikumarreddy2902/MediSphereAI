services:
  # ─── 1. FastAPI Backend API Service ──────────────────────────────────────────
  - type: web
    name: medisphere-ai-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python start.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: "/opt/render/project/src:/opt/render/project/src/backend:backend:."
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PROJECT_NAME
        value: "MediSphere AI"
      - key: API_VERSION
        value: v1
      - key: MONGODB_URI
        value: ""
      - key: DATABASE_NAME
        value: medisphere_db
      - key: SECRET_KEY
        value: "medisphere-super-secret-key-change-in-production-use-128-char-random-hex"
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: ALLOWED_ORIGINS
        value: "*"

  # ─── 2. Next.js Frontend Web Service ─────────────────────────────────────────
  - type: web
    name: medisphere-ai-frontend
    runtime: node
    region: oregon
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_API_URL
        value: "https://medisphere-ai-api.onrender.com/api/v1"
      - key: NEXT_PUBLIC_WS_URL
        value: "wss://medisphere-ai-api.onrender.com/api/v1/ws/dashboard"
      - key: NEXT_PUBLIC_ENABLE_MOCK_FALLBACK
        value: "true"
      - key: NEXT_PUBLIC_HOSPITAL_NAME
        value: "MediSphere AI Super Speciality Hospital"
      - key: NEXT_PUBLIC_HOSPITAL_UHID_PREFIX
        value: "MS-2026"
      - key: NEXT_PUBLIC_EMERGENCY_HELPLINE
        value: "108"

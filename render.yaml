services:
  # ─── MediSphere AI Fullstack Single Deployment (Unified Next.js + FastAPI) ────
  - type: web
    name: medisphere-ai
    env: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    branch: main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: medisphere_db
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PROJECT_NAME
        value: "MediSphere AI"
      - key: API_VERSION
        value: v1
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: NEXT_PUBLIC_API_URL
        value: "/api/v1"
      - key: NEXT_PUBLIC_WS_URL
        value: ""
      - key: NEXT_PUBLIC_ENABLE_MOCK_FALLBACK
        value: "true"
      - key: NEXT_PUBLIC_HOSPITAL_NAME
        value: "MediSphere AI Super Speciality Hospital"
      - key: NEXT_PUBLIC_HOSPITAL_UHID_PREFIX
        value: "MS-2026"
      - key: NEXT_PUBLIC_EMERGENCY_HELPLINE
        value: "108"

services:
  web:
    type: web
    name: medisphere-api
    env: python
    buildCommand: "bash build.sh || pip install -r requirements.txt"
    startCommand: "gunicorn --chdir backend app.main:app -w 1 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT || uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHONPATH
        value: "backend:."
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: MONGODB_URI
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://medisphere-ai.vercel.app,http://localhost:3000"
    healthCheckPath: /health
    autoDeploy: false

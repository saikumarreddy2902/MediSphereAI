name: MediSphere Enterprise CI

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ─── 1. Backend Lint & Unit/Integration Tests ──────────────────────────────
  backend-tests:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGODB_URI: "mongodb://localhost:27017"
      DATABASE_NAME: "medisphere_test_db"
      SECRET_KEY: "ci-test-secret-key-32chars-minimum-enterprise"
      ENVIRONMENT: "test"
      API_VERSION: "v1"
      ALLOWED_ORIGINS: '["http://localhost:3000"]'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-asyncio mongomock-motor ruff

      - name: Backend Linter (Ruff)
        run: |
          ruff check backend/

      - name: Run Backend Pytest Suite
        run: |
          python -m pytest backend/tests/ -v \
            --cov=backend/app \
            --cov-report=term-missing \
            --cov-report=xml:backend/coverage.xml

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-coverage
          path: backend/coverage.xml
          retention-days: 14

  # ─── 2. Frontend Lint, TypeCheck & Build ────────────────────────────────────
  frontend-ci:
    name: Frontend Lint, TypeCheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend Linter (ESLint)
        working-directory: ./frontend
        run: npm run lint

      - name: TypeScript Static Type Check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Next.js Production Build Verification
        working-directory: ./frontend
        run: npm run build

  # ─── 3. Docker Container Build Verification ────────────────────────────────
  docker-build:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-ci]
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t medisphere-backend:ci ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t medisphere-frontend:ci ./frontend

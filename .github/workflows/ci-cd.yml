name: MediSphere AI CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ─── Backend Lint ──────────────────────────────────────────────────────────
  lint-backend:
    name: Backend Lint (Ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Linter
        run: ruff check backend/

  # ─── Backend Tests ─────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint-backend

    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGODB_URI: "mongodb://localhost:27017"
      DATABASE_NAME: "medisphere_test_db"
      SECRET_KEY: "ci-test-secret-key-32chars-minimum"
      ENVIRONMENT: "test"
      API_VERSION: "v1"
      ALLOWED_ORIGINS: '["http://localhost:3000"]'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest-cov

      - name: Run Pytest with Coverage
        working-directory: backend
        run: |
          python -m pytest tests/ -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload Coverage Report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: backend/coverage.xml
          flags: backend

  # ─── Frontend Lint & Build ─────────────────────────────────────────────────
  test-frontend:
    name: Frontend Lint & Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Modules
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript Type Check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Run Next.js Build
        working-directory: ./frontend
        run: npm run build

  # ─── Container Security Scan ───────────────────────────────────────────────
  container-security-scan:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Run GitLeaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Backend Docker Image
        run: docker build -t medisphere-backend:latest ./backend

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "medisphere-backend:latest"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

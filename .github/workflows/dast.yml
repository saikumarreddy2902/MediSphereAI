name: MediSphere Enterprise Dynamic Security Testing (DAST)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 4 * * 0' # Weekly Sunday 04:00 UTC
  workflow_dispatch:

concurrency:
  group: dast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap-api-scan:
    name: OWASP ZAP Dynamic API Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt uvicorn httpx

      - name: Start MediSphere API Server
        env:
          MONGODB_URI: "mongodb://localhost:27017"
          DATABASE_NAME: "medisphere_dast_db"
          SECRET_KEY: "dast-scan-secret-key-32chars-minimum-enterprise"
          ENVIRONMENT: "test"
          API_VERSION: "v1"
          ALLOWED_ORIGINS: '["http://localhost:3000"]'
        run: |
          cd backend
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do
            if curl -s -f http://127.0.0.1:8000/health > /dev/null; then
              echo "✅ MediSphere API Server ready on port 8000"
              break
            fi
            echo "Waiting for API server initialization ($i/30)..."
            sleep 2
          done

      - name: Verify API Live Readiness & Fetch OpenAPI Definition
        run: |
          curl -f http://127.0.0.1:8000/health || exit 1
          curl -f http://127.0.0.1:8000/api/v1/openapi.json -o ./openapi.json || exit 1
          echo "OpenAPI schema successfully extracted."

      - name: Run OWASP ZAP API Security Scanner
        run: |
          docker run --network="host" -v $(pwd):/zap/wrk/:rw -t zaproxy/zap-stable zap-api-scan.py \
            -t http://127.0.0.1:8000/api/v1/openapi.json \
            -f openapi \
            -a \
            -r zap_report.html \
            -J report_json.json || true

      - name: Upload OWASP ZAP DAST Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-zap-dast-security-report
          path: |
            zap_report.html
            report_json.json
          if-no-files-found: ignore


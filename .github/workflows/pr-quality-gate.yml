name: MediSphere Enterprise PR Quality Gate

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

concurrency:
  group: pr-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. Semantic PR Title & Conventional Commits ───────────────────────────
  pr-title-check:
    name: Conventional Commits PR Title Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate PR Title Format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            sec

  # ─── 2. PR Description & Testing Evidence Verification ─────────────────────
  pr-body-check:
    name: PR Description & Checklist Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify PR Description Content
        run: |
          PR_BODY="${{ github.event.pull_request.body }}"
          if [ -z "$PR_BODY" ] || [ ${#PR_BODY} -lt 30 ]; then
            echo "❌ [REJECTED] Pull Request description is empty or too short."
            echo "Enterprise policy requires a meaningful description and testing summary."
            exit 1
          fi
          echo "✅ PR description meets enterprise quality standards."

  # ─── 3. PR Code Size & Reviewability Guard ─────────────────────────────────
  pr-size-guard:
    name: PR Size & Reviewability Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check PR Line Diff Size
        run: |
          ADDITIONS=${{ github.event.pull_request.additions }}
          DELETIONS=${{ github.event.pull_request.deletions }}
          TOTAL_CHANGES=$((ADDITIONS + DELETIONS))
          echo "PR Total Line Changes: $TOTAL_CHANGES (+$ADDITIONS / -$DELETIONS)"
          if [ "$TOTAL_CHANGES" -gt 1500 ]; then
            echo "⚠️ [WARNING] PR exceeds 1,500 lines of changes. Consider splitting into modular review chunks."
          else
            echo "✅ PR change size is within reviewable enterprise limits."
          fi

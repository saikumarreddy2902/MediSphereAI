name: MediSphere Enterprise Security & DevSecOps

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. GitLeaks Secret Scanning ───────────────────────────────────────────
  secret-scan:
    name: Secret Scanner (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code (Full History for Secret Scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 2. Python Static Application Security Testing (Bandit) ───────────────
  python-sast:
    name: Python SAST Scanner (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit Security Analysis
        run: |
          bandit -r backend/app/ -ll -ii

  # ─── 3. Dependency Vulnerability Auditing (pip-audit & npm audit) ───────────
  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit Backend Python Dependencies
        run: |
          pip-audit -r backend/requirements.txt --desc on

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Audit Frontend NPM Dependencies
        working-directory: ./frontend
        run: |
          npm audit --audit-level=high

  # ─── 4. Container Vulnerability & Misconfiguration Scan (Trivy) ────────────
  container-security:
    name: Container Security Scanner (Trivy)
    runs-on: ubuntu-latest
    needs: [python-sast, dependency-audit]
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image for Scanning
        run: |
          docker build -t medisphere-backend:security-scan ./backend

      - name: Scan Image with Trivy (Fail on CRITICAL & HIGH)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "medisphere-backend:security-scan"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Scan Repository Configs & Dockerfiles with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

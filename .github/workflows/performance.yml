name: MediSphere Enterprise Performance & SLA Benchmark

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: perf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance-benchmark:
    name: API Latency & SLA Performance Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SECRET_KEY: "perf-test-secret-key-32chars-minimum-enterprise"
      ENVIRONMENT: "test"
      API_VERSION: "v1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest-asyncio pytest

      - name: Run Latency SLA Performance Benchmarks
        run: |
          pytest backend/tests/test_performance_sla.py -v --durations=10

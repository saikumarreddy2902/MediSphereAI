[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medisphere-ai"
version = "1.0.0"
description = "Enterprise Hospital Operations Intelligence & Multi-Agent Platform"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = [
    "backend/tests"
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E501",
    "E712",
    "E722",
]

[tool.pyright]
extraPaths = ["backend"]
